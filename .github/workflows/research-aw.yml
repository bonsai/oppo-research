name: Research AW

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Research Issue number"
        required: true
        default: "12"
      spawn:
        description: "Spawn parallel AW agents"
        required: true
        default: "true"

jobs:
  inventory:
    name: 📚 Book Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory books.md
        run: |
          mkdir -p aw
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('books.md').read_text()
          rows = []
          for line in text.splitlines():
              s = line.strip()
              if s.startswith('- ') or s.startswith('## '):
                  rows.append(s.lstrip('#- ').strip())
          Path('aw/book.jsonl').write_text('\n'.join(json.dumps({'agent':'book','item':x,'issue':int('${{ inputs.issue }}')}, ensure_ascii=False) for x in rows) + '\n')
          print(f'inventory: {len(rows)} items')
          PY

  evidence:
    name: 🔎 Source Agent
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source files
        run: |
          mkdir -p aw
          find 2600 0990 -type f -maxdepth 2 2>/dev/null | sort | tee aw/sources.txt
          python - <<'PY'
          import json
          from pathlib import Path
          files = Path('aw/sources.txt').read_text().splitlines()
          with open('aw/source.jsonl','w') as f:
              for p in files:
                  f.write(json.dumps({'agent':'source','path':p,'issue':int('${{ inputs.issue }}')}, ensure_ascii=False)+'\n')
          PY

  ontology:
    name: 🕸 Ontology Agent
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ontology manifest
        run: |
          mkdir -p aw
          cat > aw/ontology.jsonl <<EOF
          {"agent":"ontology","issue":${{ inputs.issue }},"dimensions":["anonymity","speed","distance","accidentality","identity","persistence","reciprocity"],"entities":["Person","UnknownPerson","Message","Voice","Information","CommunicationMedium","Network","Community","Relationship","Payment","Memory","Narrative"]}
          EOF

  rag:
    name: 🗂 RAG Agent
    needs: [evidence, ontology]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize RAG records
        run: |
          mkdir -p aw/rag
          python - <<'PY'
          import json
          from pathlib import Path
          records=[]
          for p in Path('2600').glob('**/*'):
              if p.is_file(): records.append({'id':p.as_posix(),'type':'source','source':p.as_posix(),'evidence_level':'unverified','status':'inventory'})
          for p in Path('0990').glob('**/*'):
              if p.is_file(): records.append({'id':p.as_posix(),'type':'source','source':p.as_posix(),'evidence_level':'unverified','status':'inventory'})
          Path('aw/rag/research.jsonl').write_text('\n'.join(json.dumps(x,ensure_ascii=False) for x in records)+'\n')
          print(f'RAG records: {len(records)}')
          PY

  brief:
    name: 📝 Research Brief Agent
    needs: [inventory, evidence, ontology, rag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Research Brief manifest
        run: |
          mkdir -p aw
          cat > aw/manifest.json <<EOF
          {
            "issue": ${{ inputs.issue }},
            "mission": "Research AW",
            "agents": ["book", "source", "ontology", "rag", "brief"],
            "status": "executed",
            "outputs": ["aw/book.jsonl", "aw/source.jsonl", "aw/ontology.jsonl", "aw/rag/research.jsonl"],
            "next": "claim extraction, evidence verification, Research Brief"
          }
          EOF
          cat aw/manifest.json
