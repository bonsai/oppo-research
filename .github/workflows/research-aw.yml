name: Research AW

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Research Issue number"
        required: true
        default: "12"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  research-aw:
    name: Research AW #12
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set mission
        run: echo "ISSUE=${{ inputs.issue || '12' }}" >> "$GITHUB_ENV"

      - name: 📚 Book Agent
        run: |
          mkdir -p aw research/sources
          python - <<'PY'
          import json
          from pathlib import Path
          issue=12
          text=Path('books.md').read_text()
          rows=[]
          for line in text.splitlines():
              s=line.strip()
              if s.startswith('- ') or s.startswith('## '): rows.append(s.lstrip('#- ').strip())
          records=[{'agent':'book','item':x,'issue':issue,'status':'inventory'} for x in rows]
          text='\n'.join(json.dumps(x,ensure_ascii=False) for x in records)+'\n'
          Path('aw/book.jsonl').write_text(text)
          Path('research/sources/books.jsonl').write_text(text)
          print(f'book inventory: {len(rows)}')
          PY

      - name: 🔎 Source Agent
        run: |
          mkdir -p research/sources
          find 2600 0990 -type f -maxdepth 2 2>/dev/null | sort > aw/sources.txt
          python - <<'PY'
          import json
          from pathlib import Path
          files=Path('aw/sources.txt').read_text().splitlines()
          records=[{'agent':'source','path':p,'issue':12,'status':'inventory'} for p in files]
          text='\n'.join(json.dumps(x,ensure_ascii=False) for x in records)+'\n'
          Path('aw/source.jsonl').write_text(text)
          Path('research/sources/inventory.jsonl').write_text(text)
          print(f'source inventory: {len(files)}')
          PY

      - name: 🕸 Ontology Agent
        run: |
          mkdir -p research/ontology
          cat > research/ontology/communication-media.jsonl <<'EOF'
          {"agent":"ontology","issue":12,"dimensions":["anonymity","speed","distance","accidentality","identity","persistence","reciprocity"],"entities":["Person","UnknownPerson","Message","Voice","Information","CommunicationMedium","Network","Community","Relationship","Payment","Memory","Narrative"]}
          EOF
          cp research/ontology/communication-media.jsonl aw/ontology.jsonl

      - name: 🗂 RAG Agent
        run: |
          mkdir -p rag research/claims research/timeline
          python - <<'PY'
          import json
          from pathlib import Path
          records=[]
          for root in ('2600','0990'):
              for p in Path(root).glob('**/*'):
                  if p.is_file():
                      records.append({'id':p.as_posix(),'type':'source','source':p.as_posix(),'evidence_level':'unverified','status':'inventory','issue':12})
          text='\n'.join(json.dumps(x,ensure_ascii=False) for x in records)+'\n'
          Path('aw/rag-research.jsonl').write_text(text)
          Path('rag/research.jsonl').write_text(text)
          Path('research/claims/README.md').write_text('# Claims\n\nResearch AW claim extraction output. Historical claims require provenance and evidence level A/B/C/D.\n')
          Path('research/timeline/README.md').write_text('# Timeline\n\nResearch AW normalized communication-media timeline.\n')
          print(f'RAG records: {len(records)}')
          PY

      - name: 📝 Research Brief Agent
        run: |
          mkdir -p research/briefs
          cat > research/briefs/p2-research-brief.md <<'EOF'
          # P2 Research Brief

          - Issue: #12
          - Status: Research AW executed
          - Book inventory: `research/sources/books.jsonl`
          - Source inventory: `research/sources/inventory.jsonl`
          - Ontology: `research/ontology/communication-media.jsonl`
          - RAG: `rag/research.jsonl`

          ## Next
          1. Extract claims from primary/contemporaneous sources.
          2. Assign evidence level A/B/C/D.
          3. Normalize timeline and relations.
          4. Cross-check conflicts and duplicates.
          5. Handoff the Research Brief to `oppo-novel` and `oppo-poc`.
          EOF

      - name: 💾 Persist Research AW outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research rag
          git commit -m "research: persist Research AW outputs" || exit 0
          git push
