name: Research AW

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Research Issue number"
        required: true
        default: "13"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  research-aw:
    name: Research AW
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set mission
        run: echo "ISSUE=${{ inputs.issue || '13' }}" >> "$GITHUB_ENV"

      - name: 📞 Special Numbers Agent
        run: |
          mkdir -p aw research
          python - <<'PY'
          import json
          from pathlib import Path

          issue = int(__import__('os').environ.get('ISSUE', '13'))
          numbers = [
              ('110','1XY','警察','緊急通報'),
              ('118','1XY','海上保安庁','海上における事件・事故の緊急通報'),
              ('119','1XY','消防','火災・救急・救助の緊急通報'),
              ('104','1XY','番号案内','電話番号案内'),
              ('113','1XY','故障受付','電話サービスの故障受付'),
              ('114','1XY','話中調査','話中の電話に関する調査'),
              ('115','1XY','電報','電報サービス'),
              ('116','1XY','電話サービス窓口','電話サービスの各種問い合わせ'),
              ('117','1XY','時報','時刻案内'),
              ('171','1XY','災害用伝言ダイヤル','災害時の安否等の音声伝言'),
              ('177','1XY','天気予報','地域の天気予報'),
              ('188','1XY','消費者ホットライン','消費生活相談窓口案内'),
              ('189','1XY','児童相談所虐待対応ダイヤル','児童虐待に関する通告・相談'),
              ('0120','0AB0','フリーダイヤル等','着信者課金型サービス'),
              ('0570','0AB0','ナビダイヤル','全国共通の有料案内番号'),
              ('0800','0AB0','着信課金','着信者課金型サービス'),
              ('010','国際系','国際電話','国際電話の発信'),
              ('020','0A0','M2M等','データ通信等に利用される番号帯'),
              ('050','0A0','IP電話','IP電話'),
              ('070','0A0','携帯電話等','携帯電話番号帯'),
              ('080','0A0','携帯電話','携帯電話番号帯'),
              ('090','0A0','携帯電話','携帯電話番号帯'),
              ('1417','留守電','留守番電話','通信事業者等の留守番電話関連番号'),
              ('1416','留守電','留守番電話','通信事業者等の留守番電話関連番号'),
              ('#9110','特殊コード','警察相談','緊急ではない警察相談'),
              ('#7119','特殊コード','救急安心センター','救急相談'),
              ('1418','research','ボイスメモエージェント候補','研究上の仮番号。実在の特番とは区別する'),
          ]

          records = []
          for number, category, name, purpose in numbers:
              records.append({
                  'number': number,
                  'category': category,
                  'name': name,
                  'purpose': purpose,
                  'operator': None,
                  'availability': 'to_research',
                  'fee': None,
                  'caller': None,
                  'interaction': None,
                  'input': None,
                  'output': None,
                  'accessibility': None,
                  'source': [],
                  'notes': None,
                  'research_status': 'seed',
                  'issue': issue,
                  'agent': 'special-numbers',
              })

          text = ''.join(json.dumps(r, ensure_ascii=False) + '\n' for r in records)
          Path('aw/special-numbers.jsonl').write_text(text)
          Path('research/special-numbers.jsonl').write_text(text)
          print(f'special numbers seed records: {len(records)}')
          PY

      - name: 📚 Book Agent
        run: |
          mkdir -p aw research/sources
          python - <<'PY'
          import json
          from pathlib import Path
          issue=int(__import__('os').environ.get('ISSUE','13'))
          text=Path('books.md').read_text()
          rows=[]
          for line in text.splitlines():
              s=line.strip()
              if s.startswith('- ') or s.startswith('## '): rows.append(s.lstrip('#- ').strip())
          records=[{'agent':'book','item':x,'issue':issue,'status':'inventory'} for x in rows]
          text='\n'.join(json.dumps(x,ensure_ascii=False) for x in records)+'\n'
          Path('aw/book.jsonl').write_text(text)
          Path('research/sources/books.jsonl').write_text(text)
          print(f'book inventory: {len(rows)}')
          PY

      - name: 🔎 Source Agent
        run: |
          mkdir -p research/sources
          find 2600 0990 -type f -maxdepth 2 2>/dev/null | sort > aw/sources.txt
          python - <<'PY'
          import json
          from pathlib import Path
          issue=int(__import__('os').environ.get('ISSUE','13'))
          files=Path('aw/sources.txt').read_text().splitlines()
          records=[{'agent':'source','path':p,'issue':issue,'status':'inventory'} for p in files]
          text='\n'.join(json.dumps(x,ensure_ascii=False) for x in records)+'\n'
          Path('aw/source.jsonl').write_text(text)
          Path('research/sources/inventory.jsonl').write_text(text)
          print(f'source inventory: {len(files)}')
          PY

      - name: 🕸 Ontology Agent
        run: |
          mkdir -p research/ontology
          cat > research/ontology/communication-media.jsonl <<'EOF'
          {"agent":"ontology","issue":13,"dimensions":["anonymity","speed","distance","accidentality","identity","persistence","reciprocity"],"entities":["Person","UnknownPerson","Message","Voice","Information","CommunicationMedium","Network","Community","Relationship","Payment","Memory","Narrative"]}
          EOF
          cp research/ontology/communication-media.jsonl aw/ontology.jsonl

      - name: 💾 Persist Research AW outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aw research
          git commit -m "research: persist Research AW outputs" || exit 0
          git push
